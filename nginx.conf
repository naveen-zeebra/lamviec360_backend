# ============================================================
# LàmViệc360 DEV API Gateway
# Domain: devapi.lamviec360.com
#
# Jobseeker  -> 8001
# Company    -> 8002
# Super Admin -> 8003
# ============================================================


# ============================================================
# UPSTREAM SERVICES
# ============================================================

upstream jobseeker_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream company_backend {
    server 127.0.0.1:8002;
    keepalive 32;
}

upstream admin_backend {
    server 127.0.0.1:8003;
    keepalive 32;
}


# ============================================================
# HTTP SERVER
# HTTP -> HTTPS
# ============================================================

server {
    if ($host = devapi.lamviec360.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name devapi.lamviec360.com;

    # Certbot verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

}



# ============================================================
# HTTPS SERVER
# ============================================================

server {
    listen 443 ssl;

    server_name devapi.lamviec360.com;


    # ========================================================
    # SSL CERTIFICATE
    # ========================================================
    ssl_certificate /etc/letsencrypt/live/devapi.lamviec360.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/devapi.lamviec360.com/privkey.pem; # managed by Certbot

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    # ========================================================
    # GENERAL SETTINGS
    # ========================================================

    # File upload limit
    client_max_body_size 25M;

    # Backend timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;


    # ========================================================
    # COMMON PROXY SETTINGS
    # ========================================================

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";


    # ========================================================
    # 1. JOBSEEKER GATEWAY
    # Port: 8001
    # ========================================================

    # Canonical:
    # /api/v1/jobseeker/*
    #
    # Example:
    # /api/v1/jobseeker/login
    # -> 127.0.0.1:8001/api/v1/jobseeker/login

    location /api/v1/jobseeker/ {
        proxy_pass http://jobseeker_backend;
    }


    # Short alias:
    # /api/jobseeker/*
    #
    # Example:
    # /api/jobseeker/login
    # -> 127.0.0.1:8001/api/v1/jobseeker/login

    location /api/jobseeker/ {
        proxy_pass http://jobseeker_backend/api/v1/jobseeker/;
    }
 # ========================================================
    # 2. COMPANY GATEWAY
    # Port: 8002
    # ========================================================

    # Canonical:
    # /api/v1/company/*

    location /api/v1/company/ {
        proxy_pass http://company_backend;
    }


    # Short alias:
    # /api/company/*

    location /api/company/ {
        proxy_pass http://company_backend/api/v1/company/;
    }


    # ========================================================
    # 3. SUPER ADMIN GATEWAY
    # Port: 8003
    # ========================================================

    # Canonical:
    # /api/v1/admin/*

    location /api/v1/admin/ {
        proxy_pass http://admin_backend;
    }

 # ========================================================
    # 3. SUPER ADMIN GATEWAY
    # Port: 8003
    # ========================================================

    # Canonical:
    # /api/v1/admin/*

    location /api/v1/admin/ {
        proxy_pass http://admin_backend;
    }


    # Standard admin API:
    # /api/v1/*

    location /api/v1/ {
        proxy_pass http://admin_backend;
    }


    # Short alias:
    # /api/admin/*

    location /api/admin/ {
        proxy_pass http://admin_backend/api/v1/admin/;
    }


    # ========================================================
    # 4. JOBSEEKER SWAGGER
    # ========================================================

    location = /api/v1/jobseeker/docs {
        proxy_pass http://jobseeker_backend/docs;
    }

    location = /api/v1/jobseeker/openapi.json {
        proxy_pass http://jobseeker_backend/openapi.json;
    }

 # ========================================================
    # 4. STATIC UPLOADS
    # Logos, Avatars, Resumes, Documents
    # ========================================================

    location /uploads/ {
        proxy_pass http://jobseeker_backend;
    }
 # ========================================================
    # 4. JOBSEEKER SWAGGER
    # ========================================================

    location = /api/v1/jobseeker/docs {
        proxy_pass http://jobseeker_backend/docs;
    }

    location = /api/v1/jobseeker/openapi.json {
        proxy_pass http://jobseeker_backend/openapi.json;
    }


    # ========================================================
    # 5. COMPANY SWAGGER
    # ========================================================

    # Your required URL:
    #
    # https://devapi.lamviec360.com/api/v1/company/docs

    location = /api/v1/company/docs {
        proxy_pass http://company_backend/docs;
    }

    location = /api/v1/company/openapi.json {
        proxy_pass http://company_backend/openapi.json;
    }

 # ========================================================
    # 6. ADMIN SWAGGER
    # ========================================================

    location = /api/v1/admin/docs {
        proxy_pass http://admin_backend/docs;
    }

    location = /api/v1/admin/openapi.json {
        proxy_pass http://admin_backend/openapi.json;
    }


    # ========================================================
    # 7. HEALTH CHECK
    # ========================================================

    location = /health {
        default_type application/json;

        return 200 '{"status":"healthy","service":"api_gateway","timestamp":"$time_iso8601"}';
    }


    # ========================================================
    # 8. NGINX HEALTH CHECK
    # ========================================================

    location = /nginx-health {
        access_log off;

        default_type text/plain;

        return 200 "nginx ok\n";
    }



}