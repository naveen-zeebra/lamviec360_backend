# ==============================================================================
# Nginx Configuration for LàmViệc360 API Gateway (api.lamviec360.com)
#
# Reverse proxies to PM2 FastAPI microservices:
#   - Port 8001: Jobseeker Gateway   (/api/v1/jobseeker)
#   - Port 8002: Company Gateway     (/api/v1/company)
#   - Port 8003: Super Admin Gateway (/api/v1/admin & /api/v1)
# ==============================================================================

upstream jobseeker_backend {
    server 127.0.0.1:8001;
    keepalive 32;
}

upstream company_backend {
    server 127.0.0.1:8002;
    keepalive 32;
}

upstream admin_backend {
    server 127.0.0.1:8003;
    keepalive 32;
}

server {
    listen 80;
    server_name api.lamviec360.com;

    # Allow file uploads (resumes, company logos, licenses up to 25MB)
    client_max_body_size 25M;

    # Timeouts for AI generation, bulk operations, and database tasks
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Common proxy headers
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------------------------------------------------------------------
    # 1. JOBSEEKER GATEWAY (Port 8001)
    # --------------------------------------------------------------------------
    # Canonical API path: /api/v1/jobseeker/...
    location /api/v1/jobseeker/ {
        proxy_pass http://jobseeker_backend;
    }

    # Short alias compatibility: /api/jobseeker/... -> /api/v1/jobseeker/...
    location /api/jobseeker/ {
        proxy_pass http://jobseeker_backend/api/v1/jobseeker/;
    }

    # --------------------------------------------------------------------------
    # 2. COMPANY / EMPLOYER GATEWAY (Port 8002)
    # --------------------------------------------------------------------------
    # Canonical API path: /api/v1/company/...
    location /api/v1/company/ {
        proxy_pass http://company_backend;
    }

    # Short alias compatibility: /api/company/... -> /api/v1/company/...
    location /api/company/ {
        proxy_pass http://company_backend/api/v1/company/;
    }

    # --------------------------------------------------------------------------
    # 3. SUPER ADMIN GATEWAY (Port 8003)
    # --------------------------------------------------------------------------
    # Canonical API path: /api/v1/admin/...
    location /api/v1/admin/ {
        proxy_pass http://admin_backend;
    }

    # Standard /api/v1/... path used by new-super-admin-web
    location /api/v1/ {
        proxy_pass http://admin_backend;
    }

    # Short alias compatibility: /api/admin/... -> /api/v1/admin/...
    location /api/admin/ {
        proxy_pass http://admin_backend/api/v1/admin/;
    }

    # --------------------------------------------------------------------------
    # 4. HEALTH CHECK
    # --------------------------------------------------------------------------
    location /health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"api_gateway","timestamp":"$time_iso8601"}';
    }
}
